<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{layout/base :: head('Error')}"></head>
<body>

    <div th:replace="~{layout/base :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5 text-center">
                    <div class="card p-5 border-0 shadow-sm bg-white">
                        <div class="d-inline-flex p-3 rounded-circle bg-warning-subtle text-warning mx-auto mb-3">
                            <i class="bi bi-exclamation-octagon-fill fs-1"></i>
                        </div>
                        <h1 class="fw-bold display-4 mb-2" th:text="${statusCode}">404</h1>
                        <h4 class="fw-bold mb-3">Notice</h4>
                        <p class="text-muted small mb-4" th:text="${errorMessage}">An unexpected error occurred while processing your request.</p>
                        <div>
                            <a th:href="@{/dashboard}" class="btn btn-primary px-4 shadow-sm">
                                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
