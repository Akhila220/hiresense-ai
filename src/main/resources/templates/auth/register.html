<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{layout/base :: head('Register')}"></head>
<body>

    <div th:replace="~{layout/base :: navbar}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="card p-4 p-md-5 border-0 shadow-sm">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                                <i class="bi bi-person-plus-fill fs-2"></i>
                            </div>
                            <h3 class="fw-bold">Create Free Account</h3>
                            <p class="text-muted small">Start analyzing your resumes with private PostgreSQL data isolation.</p>
                        </div>

                        <form th:action="@{/register}" th:object="${userDto}" method="post">
                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold small">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                           placeholder="e.g. Alex Johnson" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <!-- Email Address -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                           placeholder="alex@university.edu" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small">Password (Min. 6 chars)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                    <input type="password" id="password" th:field="*{password}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                           placeholder="••••••••" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold small">Confirm Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control border-start-0" 
                                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                           placeholder="••••••••" required>
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                                <i class="bi bi-check2-circle me-1"></i> Register & Get Started
                            </button>
                        </form>

                        <div class="text-center border-top pt-3">
                            <p class="text-muted small mb-0">Already registered? <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">Sign in here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
