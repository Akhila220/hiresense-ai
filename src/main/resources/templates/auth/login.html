<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{layout/base :: head('Log In')}"></head>
<body>

    <div th:replace="~{layout/base :: navbar}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card p-4 p-md-5 border-0 shadow-sm">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                                <i class="bi bi-person-fill-lock fs-2"></i>
                            </div>
                            <h3 class="fw-bold">Welcome Back</h3>
                            <p class="text-muted small">Sign in to manage your resumes, inspect ATS analyses, and match jobs.</p>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                            </button>
                        </form>

                        <div class="text-center border-top pt-3">
                            <p class="text-muted small mb-0">Don't have an account? <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Create an account</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
